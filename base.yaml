services:
  master:
    build: ./master
    container_name: master
    ports:
      - "8080:8080"   # dashboard
    networks:
      - k8s-sim

  worker-1:
    build: ./worker
    container_name: worker-1
    environment:
      - WORKER_ID=worker-1
      - CPU_CORES=4
      - RAM_MB=8192
      - DISK_GB=100
    networks:
      - k8s-sim

  worker-2:
    build: ./worker
    container_name: worker-2
    environment:
      - WORKER_ID=worker-2
      - CPU_CORES=2
      - RAM_MB=4096
      - DISK_GB=50
    networks:
      - k8s-sim

networks:
  k8s-sim:
    driver: bridge